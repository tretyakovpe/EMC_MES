<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление складами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/warehouses.css">
</head>

<body>
    <!-- Navbar с логотипом -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="/static/images/logo.png" alt="Company Logo" height="32" class="d-inline-block align-top">
                <span class="ms-2 d-none d-sm-inline">🏢 Управление складами</span>
            </a>
        </div>
    </nav>

    <!-- Контент -->
    <div class="warehouses-container">
        <div class="warehouses-header">
            <h1>🏢 Управление складами</h1>
            <button id="add-warehouse-btn" class="btn-primary">➕ Добавить склад</button>
        </div>
        <div class="warehouses-table-wrapper">
            <table class="warehouses-table" id="warehouses-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Код</th>
                        <th>Название</th>
                        <th>Описание</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="warehouses-body">
                    <tr>
                        <td colspan="6">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно для редактирования склада -->
    <div class="modal" id="warehouse-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Добавление склада</h3>
                <button class="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="warehouse-id">
                <div class="form-group">
                    <label>Код склада:</label>
                    <input type="text" id="warehouse-code" placeholder="WH01" class="form-control">
                </div>
                <div class="form-group">
                    <label>Название:</label>
                    <input type="text" id="warehouse-name" placeholder="Склад готовой продукции" class="form-control">
                </div>
                <div class="form-group">
                    <label>Описание:</label>
                    <textarea id="warehouse-desc" class="form-control" placeholder="Описание склада"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="warehouse-active" checked> Активен
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="modal-cancel">Отмена</button>
                <button class="btn-save" id="modal-save">💾 Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/core/api.js"></script>
    <script src="/static/js/warehouses.js"></script>
</body>

</html>
