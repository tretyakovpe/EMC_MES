<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление материалами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/materials.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="/static/images/logo.png" alt="Company Logo" height="32" class="d-inline-block align-top">
                <span class="ms-2 d-none d-sm-inline">📦 Управление материалами</span>
            </a>
        </div>
    </nav>

    <!-- Контент -->
    <div class="materials-container">
        <div class="materials-header">
            <h1>📦 Управление материалами</h1>
            <button id="add-material-btn" class="btn-primary">➕ Добавить материал</button>
        </div>
        <div class="materials-table-wrapper">
            <table class="materials-table" id="materials-table">
                <thead>
                    <tr>
                        <th>Код</th>
                        <th>Описание</th>
                        <th>Артикул</th>
                        <th>Назначение</th>
                        <th>HU</th>
                        <th>Нетто</th>
                        <th>Брутто</th>
                        <th>Кол-во в HU</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="materials-body">
                    <tr>
                        <td colspan="9">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно для редактирования материала -->
    <div class="modal" id="material-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Добавление материала</h3>
                <button class="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="material-id">
                <div class="form-group">
                    <label>Код материала (MaterialCode):</label>
                    <input type="text" id="material-code" placeholder="C22348-103" class="form-control">
                </div>
                <div class="form-group">
                    <label>Описание:</label>
                    <input type="text" id="material-desc" placeholder="Крышка Vesta AP LH" class="form-control">
                </div>
                <div class="form-group">
                    <label>Артикул (CustomerCode):</label>
                    <input type="text" id="material-customer" placeholder="8450048072" class="form-control">
                </div>
                <div class="form-group">
                    <label>Назначение (Destination):</label>
                    <input type="text" id="material-dest" placeholder="08780" class="form-control">
                </div>
                <div class="form-group">
                    <label>HU (тип упаковки):</label>
                    <input type="text" id="material-hu" placeholder="8USP0010" class="form-control">
                </div>
                <div class="form-group row">
                    <div class="col">
                        <label>Нетто:</label>
                        <input type="number" id="material-netto" placeholder="2" class="form-control">
                    </div>
                    <div class="col">
                        <label>Брутто:</label>
                        <input type="number" id="material-brutto" placeholder="20" class="form-control">
                    </div>
                    <div class="col">
                        <label>Кол-во в HU:</label>
                        <input type="number" id="material-qty" placeholder="55" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="modal-cancel">Отмена</button>
                <button class="btn-save" id="modal-save">💾 Сохранить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/core/api.js"></script>
    <script src="/static/js/materials.js"></script>
</body>

</html>
